ontology: "Онтология поиска партнеров dGAG"
goal: "Найти белки-партнеры для dGAG и определить его функцию"
competency_questions:
  - "Какие белки могут быть партнерами dGAG?"
  - "В каких источниках описаны эти взаимодействия?"
classes:
  Белок: {parent: null, definition: "Молекула, состоящая из аминокислот"}
  dGAG: {parent: Белок, definition: "Доместицированный ретротранспозонный белок GAG"}
  Кандидат: {parent: Белок, definition: "Белок, предложенный в качестве партнера"}
  Задача: {parent: null, definition: "Исследовательская задача"}
  Файл: {parent: null, definition: "Источник данных или статья"}
properties:
  взаимодействуетС: {domain: dGAG, range: Кандидат}
  хранитсяВ: {domain: Кандидат, range: Файл}
  тип: {domain: Задача, range: Задача}
attributes:
  status: {domain: Задача, values: [открыта, в работе, выполнена, принята]}
rules:
  - id: "1"
    text: "У каждого кандидата есть источник (файл или ссылка)"
    dl: "Кандидат  хранитсяВ.Файл"
    check: "some"
  - id: "2"
    text: "Выполненная задача имеет статус выполнена или принята"
    dl: "ВыполненнаяЗадача  Задача  status.{выполнена, принята}"
    check: "defined_value"
